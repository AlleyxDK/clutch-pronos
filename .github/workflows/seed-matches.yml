name: Seed PandaScore matches

on:
  schedule:
    # Toutes les heures, à l'heure pile (UTC).
    # GitHub Actions ne garantit pas la ponctualité des crons : les runs
    # planifiés partent souvent avec plusieurs minutes de retard.
    - cron: '0 * * * *'
  # Permet le déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run seed script
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seed-pandascore.cjs
